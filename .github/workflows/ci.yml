name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Frontend Quality & Build ────────────────────────────────────────────────
  frontend-ci:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter and formatting check (Biome)
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api

  # ─── Backend Quality & Tests ─────────────────────────────────────────────────
  backend-ci:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Django system configuration
        run: python manage.py check
        env:
          SECRET_KEY: django-insecure-ci-test-secret-key-12345
          DEBUG: "True"
          ALLOWED_HOSTS: "localhost,127.0.0.1"

      - name: Check for unapplied model migrations
        run: python manage.py makemigrations --check --dry-run
        env:
          SECRET_KEY: django-insecure-ci-test-secret-key-12345
          DEBUG: "True"
          ALLOWED_HOSTS: "localhost,127.0.0.1"

      - name: Run Django test suite
        run: python manage.py test
        env:
          SECRET_KEY: django-insecure-ci-test-secret-key-12345
          DEBUG: "True"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
